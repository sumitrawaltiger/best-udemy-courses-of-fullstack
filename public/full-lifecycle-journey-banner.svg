      <stop offset="1" stop-color="#05151d"/>
    </linearGradient>
    <radialGradient id="cg" cx="50%" cy="20%" r="65%">
      <stop offset="0" stop-color="#29e0c4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#29e0c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
